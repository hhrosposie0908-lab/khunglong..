<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quan Sát Khủng Long</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Nhúng thư viện A-Frame xử lý VR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <style>
      /* Giao diện màn hình chờ tối giản chỉ giữ nút đỏ */
      #play-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: sans-serif;
      }
      /* Ô NÚT BẤM MÀU ĐỎ */
      #play-btn {
        padding: 18px 40px;
        font-size: 22px;
        font-weight: bold;
        background-color: #ff4757;
        color: white;
        border: none;
        border-radius: 35px;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(255, 71, 87, 0.5);
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: transform 0.1s ease;
      }
      #play-btn:active { transform: scale(0.95); }
    </style>
  </head>
  <body>

    <!-- Màn hình chờ - Chỉ có nút đỏ QUAN SÁT KHỦNG LONG -->
    <div id="play-overlay">
      <button id="play-btn" onclick="startVideo()">QUAN SÁT KHỦNG LONG</button>
    </div>

    <a-scene loading-screen="enabled: false">
      <a-assets>
        <video id="video-360" 
               src="video360.mp4" 
               preload="auto"
               loop="true" 
               muted="true" 
               autoplay="false"
               crossorigin="anonymous" 
               playsinline 
               webkit-playsinline>
        </video>
      </a-assets>

      <!-- SỬA TẠI ĐÂY: Thêm góc xoay rotation để nắn thẳng lại video bị lật ngang -->
      <a-videosphere src="#video-360" rotation="90 0 0"></a-videosphere>
      
      <a-camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true"></a-camera>
    </a-scene>

    <script>
      function startVideo() {
        var video = document.querySelector('#video-360');
        var overlay = document.getElementById('play-overlay');
        
        video.play().then(function() {
          overlay.style.display = 'none';
        }).catch(function(error) {
          alert("Không thể tải video. Hãy kiểm tra lại file video360.mp4 trên GitHub.");
          console.log(error);
        });
      }
    </script>
  </body>
</html>
