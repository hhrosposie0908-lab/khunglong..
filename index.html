<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Video 360 Khung Long</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Nhúng thư viện A-Frame xử lý VR mượt mà -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <style>
      /* Giao diện nút bấm bắt đầu siêu đẹp giữa màn hình */
      #play-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: sans-serif;
      }
      #play-btn {
        padding: 15px 35px;
        font-size: 18px;
        font-weight: bold;
        background-color: #ff4757;
        color: white;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      }
      #play-btn:active { transform: scale(0.95); }
      .note { margin-top: 15px; font-size: 12px; color: #ccc; text-align: center; padding: 0 20px; }
    </style>
  </head>
  <body>

    <!-- Màn hình chờ kích hoạt video (Sửa lỗi chặn tự động phát trên điện thoại) -->
    <div id="play-overlay">
      <h2>BÀI TẬP VIDEO 360°</h2>
      <p class="note">Vui lòng bấm nút bên dưới để tải và xem video</p>
      <button id="play-btn" onclick="startVideo()">XEM VIDEO 360</button>
      <p class="note">Sau khi bấm: Xoay điện thoại hoặc vuốt màn hình để nhìn xung quanh</p>
    </div>

    <!-- Không gian thực tế ảo -->
    <a-scene loading-screen="enabled: false">
      <a-assets>
        <!-- Khai báo video tối ưu hóa tối đa cho iOS và Android -->
        <video id="video-360" 
               src="video360.mp4" 
               preload="auto"
               loop="true" 
               muted="true" 
               autoplay="false"
               crossorigin="anonymous" 
               playsinline 
               webkit-playsinline>
        </video>
      </a-assets>

      <!-- Quả cầu hiển thị video 360 -->
      <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>

      <!-- Camera tích hợp cả cảm biến xoay (look-controls) -->
      <a-camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true"></a-camera>
    </a-scene>

    <script>
      function startVideo() {
        var video = document.querySelector('#video-360');
        var overlay = document.getElementById('play-overlay');
        
        // Kích hoạt phát video bằng lệnh kiểm soát của người dùng
        video.play().then(function() {
          // Ẩn màn hình chờ nếu phát thành công
          overlay.style.display = 'none';
        }).catch(function(error) {
          alert("Lỗi tải video: Hãy chắc chắn bạn đã đổi tên file video thành video360.mp4 và file không quá nặng.");
          console.log(error);
        });
      }
    </script>
  </body>
</html>
